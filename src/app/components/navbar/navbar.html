<nav
  class="fixed left-0 right-0 top-4 z-50 px-3 sm:px-6
         transition-transform duration-300 ease-out"
  [class.-translate-y-[calc(100%+1rem)]]="!isNavVisible"
>

  <!-- ========================================================= -->
  <!-- MAIN NAVBAR -->
  <!-- ========================================================= -->

  <div
    class="mx-auto flex h-16 max-w-6xl items-center
           rounded-4xl
           bg-white/90 px-4
           shadow-lg shadow-zinc-200/40
           backdrop-blur-xl
           transition-all duration-300
           sm:px-6
           md:grid md:grid-cols-3
           md:border md:border-zinc-200"
  >

    <!-- ======================================================= -->
    <!-- NAME -->
    <!-- ======================================================= -->

    <a
      href="#home"
      class="group relative inline-block w-fit"
    >
      <p
        class="whitespace-nowrap text-lg font-medium tracking-wide
               text-zinc-900
               transition-colors duration-300
               group-hover:text-blue-600
               sm:text-2xl"
      >
        Rudresh Sharma
      </p>

      <!-- Animated curved underline -->
      <span
        class="absolute -bottom-1 left-1/2
               h-[3px] w-0
               -translate-x-1/2
               rounded-[100%]
               bg-blue-600
               opacity-0
               transition-all duration-400 ease-out
               group-hover:w-full
               group-hover:opacity-100"
      ></span>
    </a>


    <!-- ======================================================= -->
    <!-- DESKTOP NAVIGATION -->
    <!-- ======================================================= -->

    <div
      class="hidden items-center justify-self-center
             gap-1 rounded-full
             bg-slate-50 p-2
             md:col-start-2 md:flex"
    >

      <!-- HOME -->
      <a
        href="#home"
        class="group relative rounded-full px-4 py-2
               text-sm font-medium text-zinc-500
               transition-all duration-300
               hover:bg-white
               hover:text-zinc-900
               hover:shadow-sm"
      >
        Home

        <span
          class="absolute bottom-1 left-1/2
                 h-[3px] w-0
                 -translate-x-1/2
                 rounded-[100%]
                 bg-blue-600
                 opacity-0
                 transition-all duration-300 ease-out
                 group-hover:w-6
                 group-hover:opacity-100"
        ></span>
      </a>


      <!-- ABOUT -->
      <a

        class="group relative rounded-full px-4 py-2
               text-sm font-medium text-zinc-500
               transition-all duration-300
               hover:bg-white
               hover:text-zinc-900

        ></span>
      </a>

    </div>


    <!-- ======================================================= -->
    <!-- MOBILE MENU BUTTON -->
    <!-- ======================================================= -->

    <button
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="isMenuOpen"
      aria-label="Toggle navigation menu"
      class="group ml-auto flex h-10 w-10 shrink-0
             items-center justify-center
             rounded-full
             bg-transparent
             text-zinc-700
             transition-all duration-300
             hover:text-blue-600
             active:scale-90
             md:hidden"
    >

      <span
        class="relative flex h-5 w-5 items-center justify-center"
      >

        <!-- Top line -->
        <span
          class="absolute h-[1.5px] w-5 rounded-full bg-current
                 transition-all duration-300 ease-out"
          [class.rotate-45]="isMenuOpen"
          [class.-translate-y-1.5]="!isMenuOpen"
        ></span>

        <!-- Middle line -->
        <span
          class="absolute h-[1.5px] w-5 rounded-full bg-current
                 transition-all duration-200 ease-out"
          [class.scale-x-0]="isMenuOpen"
          [class.opacity-0]="isMenuOpen"
        ></span>

        <!-- Bottom line -->
        <span
          class="absolute h-[1.5px] w-5 rounded-full bg-current
                 transition-all duration-300 ease-out"
          [class.-rotate-45]="isMenuOpen"
          [class.translate-y-1.5]="!isMenuOpen"
        ></span>

      </span>

    </button>

  </div>


  <!-- ========================================================= -->
  <!-- FULL SCREEN MOBILE MENU -->
  <!-- ========================================================= -->

  <div
    *ngIf="isMenuOpen"
    class="fixed inset-0 z-[100]
           flex min-h-screen
           flex-col
           bg-white"
  >

    <!-- ======================================================= -->
    <!-- MOBILE MENU HEADER -->
    <!-- ======================================================= -->

    <div
      class="flex h-20 shrink-0
             items-center
             justify-between
             px-5"
    >

      <!-- Mobile Name -->
      <a
        href="#home"
        (click)="closeMenu()"
        class="group relative inline-block
               py-2 text-2xl font-medium
               text-zinc-500
               transition-colors duration-300
               hover:text-blue-600"
      >
        Rudresh Sharma

        <!-- Animated curved underline -->
        <span
          class="absolute -bottom-1 left-1/2
                 h-[3px] w-0
                 -translate-x-1/2
                 rounded-[100%]
                 bg-blue-600
                 opacity-0
                 transition-all duration-500 ease-out
                 group-hover:w-full
                 group-hover:opacity-100"
        ></span>
      </a>


      <!-- Close Button -->
      <button
        type="button"
        (click)="closeMenu()"
        aria-label="Close navigation menu"
        class="flex h-10 w-10
               items-center justify-center
               rounded-full
               bg-transparent
               text-zinc-700
               transition-all duration-300
               hover:text-blue-600
               active:scale-90"
      >

        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.8"
          stroke="currentColor"
          class="h-6 w-6"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M6 6l12 12M6 18L18 6"
          />
        </svg>

      </button>

    </div>


    <!-- ======================================================= -->
    <!-- MOBILE LINKS -->
    <!-- ======================================================= -->

    <div

             flex-col
             items-center
             justify-center
             gap-3
