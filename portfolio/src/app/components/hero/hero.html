
<section
  id="home"
  class="relative min-h-screen overflow-hidden bg-white"
>

  <!-- Background Glow -->
  <div
    class="pointer-events-none absolute left-1/2 top-1/3
           h-[500px] w-[500px] -translate-x-1/2
           rounded-full bg-blue-100/60 blur-3xl
           animate-pulse"
  ></div>


  <!-- Subtle Grid -->
  <div
    class="pointer-events-none absolute inset-0
           bg-[linear-gradient(to_right,#f4f4f5_1px,transparent_1px),
              linear-gradient(to_bottom,#f4f4f5_1px,transparent_1px)]
           bg-[size:60px_60px]
           opacity-40"
  ></div>


  <!-- Hero Content -->
  <div
    class="relative mx-auto flex min-h-screen max-w-6xl
           items-center px-6 pt-20"
  >

    <div class="max-w-3xl">

      <!-- Small Intro -->
      <div
        class="mb-5 flex items-center gap-3
               animate-[fadeInUp_0.7s_ease-out]"
      >

        <span
          class="h-2 w-2 rounded-full bg-blue-600
                 shadow-lg shadow-blue-600/40
                 animate-pulse"
        ></span>

        <p
          class="text-sm font-medium uppercase
                 tracking-[0.25em] text-blue-600"
        >
          Software Engineer
        </p>

      </div>


      <!-- Heading -->
      <h1
        class="text-5xl font-bold leading-tight
               tracking-tight text-zinc-900
               animate-[fadeInUp_0.8s_ease-out_0.1s_both]
               sm:text-6xl lg:text-7xl"
      >

        Hi, I'm

        <span
          class="relative inline-block text-blue-600"
        >
          Rudresh Sharma

          <!-- Underline -->
          <span
            class="absolute -bottom-1 left-0 h-1
                   w-full origin-left scale-x-0
                   rounded-full bg-blue-600/20
                   animate-[growLine_0.8s_ease-out_0.8s_forwards]"
          ></span>

        </span>

      </h1>


      <!-- Description -->
      <p
        class="mt-6 max-w-2xl text-lg leading-relaxed
               text-zinc-500
               animate-[fadeInUp_0.8s_ease-out_0.2s_both]
               sm:text-xl"
      >
        I build scalable backend systems, modern web
        applications, and AI-powered solutions.
      </p>


      <!-- Tech Stack -->
      <div
        class="mt-6 flex flex-wrap gap-2
               animate-[fadeInUp_0.8s_ease-out_0.3s_both]"
      >

        <span
          class="rounded-full border border-zinc-200
                 bg-white px-3 py-1.5 text-xs
                 font-medium text-zinc-600 shadow-sm
                 transition-all duration-300
                 hover:-translate-y-1
                 hover:border-blue-200
                 hover:text-blue-600"
        >
          Java
        </span>

        <span
          class="rounded-full border border-zinc-200
                 bg-white px-3 py-1.5 text-xs
                 font-medium text-zinc-600 shadow-sm
                 transition-all duration-300
                 hover:-translate-y-1
                 hover:border-blue-200
                 hover:text-blue-600"
        >
          Spring Boot
        </span>

        <span
          class="rounded-full border border-zinc-200
                 bg-white px-3 py-1.5 text-xs
                 font-medium text-zinc-600 shadow-sm
                 transition-all duration-300
                 hover:-translate-y-1
                 hover:border-blue-200
                 hover:text-blue-600"
        >
          Python
        </span>

        <span
          class="rounded-full border border-zinc-200
                 bg-white px-3 py-1.5 text-xs
                 font-medium text-zinc-600 shadow-sm
                 transition-all duration-300
                 hover:-translate-y-1
                 hover:border-blue-200
                 hover:text-blue-600"
        >
          Angular
        </span>

        <span
          class="rounded-full border border-zinc-200
                 bg-white px-3 py-1.5 text-xs
                 font-medium text-zinc-600 shadow-sm
                 transition-all duration-300
                 hover:-translate-y-1
                 hover:border-blue-200
                 hover:text-blue-600"
        >
          AI
        </span>

      </div>


      <!-- Buttons -->
      <div
        class="mt-8 flex flex-wrap gap-4
               animate-[fadeInUp_0.8s_ease-out_0.4s_both]"
      >

        <a
          href="#projects"
          class="group flex items-center gap-2
                 rounded-xl bg-zinc-900 px-6 py-3
                 text-sm font-semibold text-white
                 shadow-lg shadow-zinc-900/10
                 transition-all duration-300
                 hover:-translate-y-1
                 hover:bg-blue-600
                 hover:shadow-xl hover:shadow-blue-600/20"
        >

          View Projects

          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="2"
            stroke="currentColor"
            class="h-4 w-4 transition-transform
                   duration-300 group-hover:translate-x-1"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3"
            />
          </svg>

        </a>


        <a
          href="#contact"
          class="rounded-xl border border-zinc-200
                 bg-white px-6 py-3
                 text-sm font-semibold text-zinc-700
                 shadow-sm
                 transition-all duration-300
                 hover:-translate-y-1
                 hover:border-blue-200
                 hover:bg-blue-50
                 hover:text-blue-600"
        >
          Contact Me
        </a>

      </div>

    </div>

  </div>


  <!-- Scroll Indicator -->
  <a
    href="#about"
    class="absolute bottom-8 left-1/2
           flex -translate-x-1/2 flex-col
           items-center gap-2
           text-zinc-400 transition-colors
           hover:text-blue-600"
  >

    <span class="text-[10px] uppercase tracking-[0.25em]">
      Scroll
    </span>

    <span
      class="flex h-9 w-6 items-start justify-center
             rounded-full border border-zinc-300 p-1"
    >
      <span
        class="h-1.5 w-1.5 rounded-full bg-blue-600
               animate-bounce"
      ></span>
    </span>

  </a>

</section>
