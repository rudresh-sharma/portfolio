  <!-- Background glow -->

    class="pointer-events-none absolute right-0 top-1/3 h-72 w-72
           rounded-full bg-blue-100/40 blur-3xl"
  ></div>

  <div class="relative mx-auto max-w-6xl px-4 sm:px-6 lg:px-8">

    <!-- Header -->
    <div class="mb-14 text-center">

      <p
        class="mb-3 font-mono text-xs font-semibold uppercase tracking-[0.25em] text-blue-600"
      >
        Get In Touch
      </p>

      <h2
        class="text-3xl font-bold tracking-tight text-zinc-900 sm:text-4xl"
      >
        Let's Build Something
      </h2>

      <p
        class="mx-auto mt-4 max-w-2xl text-sm leading-7 text-zinc-500 sm:text-base"
      >
        Have a project, opportunity, or just want to talk tech?
        I'd love to hear from you.
      </p>

    </div>


    <!-- Contact Layout -->
    <div class="mx-auto w-full max-w-3xl">

      <!-- Contact Form -->
      <div class="lg:col-span-3 ">

        <form
          class="rounded-2xl border border-zinc-200 bg-white p-7
                 shadow-sm sm:p-8"
        >

          <!-- Name + Email -->
          <div class="grid gap-6 sm:grid-cols-2">

            <!-- Name -->
            <div>

              <label
                for="name"
                class="mb-2 block text-xs font-semibold
                       uppercase tracking-wider text-zinc-600"
              >
                Name
              </label>

              <input
                id="name"
                type="text"
                placeholder="Your name"
                class="w-full rounded-xl border border-zinc-200 bg-zinc-50
                       px-4 py-3 text-sm text-zinc-900 outline-none
                       placeholder:text-zinc-400
                       transition-all duration-200
                       focus:border-blue-500 focus:bg-white
                       focus:ring-4 focus:ring-blue-500/10"
              />

            </div>


            <!-- Email -->
            <div>

              <label
                for="email"
                class="mb-2 block text-xs font-semibold
                       uppercase tracking-wider text-zinc-600"
              >
                Email
              </label>

              <input
                id="email"
                type="email"
                placeholder="you@example.com"
                class="w-full rounded-xl border border-zinc-200 bg-zinc-50
                       px-4 py-3 text-sm text-zinc-900 outline-none
                       placeholder:text-zinc-400
                       transition-all duration-200
                       focus:border-blue-500 focus:bg-white
                       focus:ring-4 focus:ring-blue-500/10"
              />

            </div>

          </div>


          <!-- Subject -->
          <div class="mt-6">

            <label
              for="subject"
              class="mb-2 block text-xs font-semibold
                     uppercase tracking-wider text-zinc-600"
            >
              Subject
            </label>

            <input
              id="subject"
              type="text"
              placeholder="What would you like to talk about?"
              class="w-full rounded-xl border border-zinc-200 bg-zinc-50
                     px-4 py-3 text-sm text-zinc-900 outline-none
                     placeholder:text-zinc-400
                     transition-all duration-200
                     focus:border-blue-500 focus:bg-white
                     focus:ring-4 focus:ring-blue-500/10"
            />

          </div>


          <!-- Message -->
          <div class="mt-6">

            <label
              for="message"
              class="mb-2 block text-xs font-semibold
                     uppercase tracking-wider text-zinc-600"
            >
              Message
            </label>

            <textarea
              id="message"
              rows="6"
              placeholder="Tell me a little about your idea..."
              class="w-full resize-none rounded-xl border border-zinc-200
                     bg-zinc-50 px-4 py-3 text-sm text-zinc-900 outline-none
                     placeholder:text-zinc-400
                     transition-all duration-200
                     focus:border-blue-500 focus:bg-white
                     focus:ring-4 focus:ring-blue-500/10"
            ></textarea>

          </div>


          <!-- Submit -->
          <button
            type="submit"
            class="group mt-6 inline-flex w-full items-center
                   justify-center gap-2 rounded-xl bg-blue-600 px-6 py-3.5
                   text-sm font-semibold text-white
                   shadow-lg shadow-blue-600/20
                   transition-all duration-300
                   hover:bg-blue-700 hover:shadow-xl hover:shadow-blue-600/25
                   active:scale-[0.98]"
          >

            Send Message

            <span
              class="transition-transform duration-300
                     group-hover:translate-x-1"
            >
              →
            </span>

          </button>

        </form>

      </div>

    </div>

  </div>

</section>
